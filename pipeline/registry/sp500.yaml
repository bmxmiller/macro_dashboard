# S&P 500 heat map: committed snapshot of the index constituents (ticker, name, GICS sector).
# Snapshot taken 2026-11-14 from Wikipedia's "List of S&P 500 companies" (not an official feed,
# so review it after index rebalances: S&P Dow Jones Indices announces changes quarterly).
# Yahoo tickers (BRK-B, not BRK.B). Companies with two listed classes (Alphabet GOOGL/GOOG,
# Fox FOXA/FOX, News Corp NWSA/NWS) appear ONCE, under the first class: Yahoo reports the
# company-wide share count for every class ticker, so listing both would count the company
# twice. The rectangle is company-wide shares x the first class's price.

chunk_size: 100
max_missing_share: 0.15   # fail the section (keep last good JSON) if more than this share has no price

about:
  what: A treemap of the S&P 500. Each rectangle is one company, sized by market capitalisation (shares outstanding x last close) and grouped by GICS sector. The colour shows its price return over the selected period.
  why: The index is cap-weighted, so a handful of mega-caps move it far more than the other 490. The map shows at a glance whether a rally or sell-off is broad or driven by a few names, and which sectors are leading.
  how_to_read: Rectangle area is proportional to market cap by default (Mkt cap). Balanced sizes by the square root of market cap instead, so small companies get larger tiles while the biggest still look biggest. Bigger rectangle = bigger weight in the index (approximately, because the index itself is float-adjusted, so companies with large insider or controlling holdings carry less index weight than their full market cap suggests). Green is a gain and red a loss (the signed % in each label carries the same information), with a deeper shade for a larger move. Returns are price returns, not total returns, so dividends are excluded. Market cap uses Yahoo's latest share count, so it can lag buybacks or new issuance. Companies with two listed share classes (Alphabet, Fox, News Corp) are shown once, sized on their combined market cap. Companies with unlisted classes or operating units (for example Interactive Brokers, TKO, Blackstone) are sized on their listed shares only, so they can look smaller than Yahoo's headline company cap; that is closer to how the index weights them. Switch the period at the top of the dashboard. Equal wt makes every company the same size instead, so you can see breadth (how many stocks are up or down) and not only the biggest names. Colours are still each stock's own return; no equal-weight index return is calculated. Click a company (on touch, tap it twice) for its returns over every period and a 12-month price chart.

source_url: https://www.spglobal.com/spdji/en/indices/equity/sp-500/

