# AI insights: LLM provider config. Free tiers only (£0). Called from the pipeline, never the browser.
#
# Providers are tried in this order. A provider is skipped when its key env var is unset.
# Model ids change often: check before bumping.
#   Gemini models + free tier: https://ai.google.dev/gemini-api/docs/models  (pricing page: "Free of charge")
#                              https://aistudio.google.com/rate-limit        (per-project RPM/RPD)
#   Groq models:               https://console.groq.com/docs/models
# One build makes 1 call (2–4 on a validation retry / fallback), far inside any free daily quota.
# Fallback order. Reorder (e.g. [groq, gemini]) to change the primary: no code change needed.
# Providers whose key env var is unset are skipped silently (info log only).
order: [gemini, groq]

providers:
  gemini:
    key_env: GEMINI_API_KEY
    # tried in order; same key, separate per-model quota, so the lite model survives a 429 on the primary
    # Pinned names (not "-latest") for reproducibility. 2026-11-14: gemini-2.5-flash is still LISTED by
    # GET /v1beta/models but generateContent returns 404 "no longer available to new users. Please
    # use models/gemini-3.8-flash". Docs list 3.8-flash and 3.5-flash-lite as free-tier stable models.
    # gemini-3.8-flash was removed (2026-11-14): in a live run it hit two 150 s read timeouts and
    # then an HTTP 503 "high demand" (~5.5 min wasted, no answer), and an isolated test call got a
    # 503 too. gemini-3.5-flash-lite answers in ~2-3 s and passes the validator (with retry).
    # Re-add a model here (first = preferred) only after checking its latency.
    models: [gemini-3.5-flash-lite]
    response_schema: true          # send responseSchema (structured output); false = JSON mode only
  groq:
    key_env: GROQ_API_KEY
    # Checked 2026-11-14 via GET /openai/v1/models: Llama chat models are no longer served to this
    # account (llama-3.3-70b-versatile → 404 model_not_found); gpt-oss supports json_object mode.
    models: [openai/gpt-oss-120b, openai/gpt-oss-20b]

temperature: 0.3
max_output_tokens: 8192            # Gemini 3.x "thinking" tokens count toward this, so leave headroom
timeout_seconds: 60                 # flash-lite answers in ~3 s; a slow provider should fail fast, not stall the run
retries: 2                         # extra attempts per provider on 429 / 5xx / timeout / bad JSON
retry_backoff_seconds: 4           # doubled each retry

endpoints:
  gemini: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  groq: https://api.groq.com/openai/v1/chat/completions

methodology_url: https://github.com/bmxmiller/macro_dashboard/blob/main/pipeline/ai/regime.py
validator_url: https://github.com/bmxmiller/macro_dashboard/blob/main/pipeline/ai/validate.py

# Sources behind the brief's digest (the regime panel lists its exact series from economy/markets.json).
brief_sources:
  - {label: "FRED (US economy, Treasury yields)", url: "https://fred.stlouisfed.org/"}
  - {label: "Yahoo Finance (market returns)", url: "https://finance.yahoo.com/"}
  - {label: "ONS / Bank of England (UK)", url: "https://www.ons.gov.uk/"}
  - {label: "CFTC Commitments of Traders", url: "https://www.cftc.gov/MarketReports/CommitmentsofTraders/index.htm"}
  - {label: "CNN Fear & Greed", url: "https://www.cnn.com/markets/fear-and-greed"}

about:
  brief:
    what: "A short, AI-written summary of today's dashboard data (markets, economy, rates, UK, sentiment, positioning) and clustered news headlines."
    why: "It turns dozens of panels into a two-minute read: what moved, what it may mean for the cycle, and which stories are driving it."
    how_to_read: "The pipeline builds a compact digest of the published numbers and asks a free LLM (Gemini, Groq as fallback) to narrate it. An automatic fact check then requires every number to match the digest exactly, with the right unit, the right direction (rose/fell) and the right metric (e.g. a number after 'core CPI' must be core CPI). It also rejects advice words (buy, sell, should…) and any regime name other than the computed one. A failing answer is sent back once with the errors, then the next provider is tried; if all fail, the previous summary is kept and marked stale. Treat it as a reading aid, not a forecast. Not investment advice."
  regime:
    what: "Three rule-based macro 'regime' lenses, computed by code (not the AI): a Growth × Inflation momentum quadrant (Investment-Clock style), Growth × Policy, and Credit × Duration."
    why: "Asset classes have historically behaved differently depending on whether growth and inflation are accelerating or decelerating, whether policy is tight or loose, and whether credit or duration is leading."
    how_to_read: "Growth × Inflation shows the DIRECTION of change, not the level. Growth score = average of (1) the 6-month change in industrial production YoY (±2pp = ±1); (2) initial claims, 4-week average vs 26-week average, inverted (a 4-week average 10% above the 26-week average = −1; a sustained 10% jump in claims ≈ −0.83 because the 26-week average includes the recent weeks); (3) the 2-quarter change in real GDP YoY (±1pp = ±1). Inflation score = average 6-month change in core CPI YoY and core PCE YoY (±1pp = ±1). Each axis is accelerating at ≥ +0.1, decelerating at ≤ −0.1, otherwise flat (shown as a boundary between two quadrants). Quadrants: Goldilocks (growth up, inflation down), Inflationary boom (both up), Stagflation (growth down, inflation up), Disinflationary slowdown (both down). Growth × Policy: real policy rate = Fed funds target-range midpoint − core PCE YoY; above 1% restrictive, below 0.5% accommodative, otherwise neutral (within 0.15pp of an edge is borderline; r* itself is uncertain). Credit × Duration: 3-month total return of HYG minus IEI and LQD minus IEF (duration-matched); above +0.5pp credit leads, below −0.5pp duration leads, otherwise balanced, with the 3-month change in the high-yield spread as a cross-check. Inputs older than their release cycle are dropped and listed. Historical tendencies are code-written generalisations from the Investment Clock study, not forecasts; the AI only explains."

# Code-authored, hedged generalisations. The LLM never writes these; it may only refer to them.
regime_tendencies:
  basis: "Greetham & Hartnett (2004), 'The Investment Clock', Merrill Lynch: average US asset-class and sector returns by growth/inflation phase, 1973–2004. Averages hide wide variation; past patterns are not forecasts."
  quadrants:
    Goldilocks:   # Investment Clock phase: Recovery
      - {id: gl_equities, text: "Equities have historically tended to outperform bonds, commodities and cash in this phase."}
      - {id: gl_cyclicals, text: "Cyclical and growth sectors have historically tended to lead defensive sectors."}
      - {id: gl_commodities, text: "Commodities have historically tended to lag as inflation cools."}
    Inflationary boom:   # Investment Clock phase: Overheat
      - {id: ib_commodities, text: "Commodities have historically tended to be the strongest asset class in this phase."}
      - {id: ib_bonds, text: "Government bonds have historically tended to lag as inflation and rate expectations rise."}
      - {id: ib_value, text: "Cyclical value sectors such as industrials, materials and energy have historically tended to do relatively well."}
    Stagflation:
      - {id: st_cash, text: "Cash has historically tended to be the strongest asset class in this phase, and equities among the weakest."}
      - {id: st_defensives, text: "Defensive sectors such as utilities and consumer staples have historically tended to hold up better than cyclicals."}
      - {id: st_commodities, text: "Commodities have sometimes held up while inflation was rising, but results varied widely."}
    Disinflationary slowdown:   # Investment Clock phase: Reflation
      - {id: ds_bonds, text: "Government bonds have historically tended to be the strongest asset class in this phase."}
      - {id: ds_commodities, text: "Commodities have historically tended to be the weakest asset class."}
      - {id: ds_defensives, text: "Defensive growth sectors such as health care have historically tended to beat cyclicals."}
