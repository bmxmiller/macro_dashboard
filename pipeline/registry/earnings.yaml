# Earnings section: the ~60 largest S&P 500 companies by market cap (hand-maintained,
# reviewed 2026-11; one share class per company). Yahoo tickers (BRK-B, not BRK.B).

window_days: 14
throttle_seconds: 0.4

about:
  what: Scheduled quarterly earnings reports over the next two weeks for the largest S&P 500 companies, with the consensus EPS estimate and the EPS reported for the same quarter a year earlier.
  why: The largest companies make up most of the index's weight, so their results (and especially their guidance) can move the whole market, sector ETFs and volatility.
  how_to_read: BMO means before the market opens and AMC means after the close, so the price reaction comes on the same day or the next session respectively. Comparing the estimate with the prior-year EPS shows the growth analysts already expect. Around three quarters of S&P 500 companies typically beat consensus, so the size of the beat and the guidance matter more than a beat itself. Dates come from Yahoo Finance and occasionally shift if a company reschedules.

